The equation defines the color of each pixel in the output image.
Each pixel is mapped to an initial condition, and its color is defined according the divergence speed of the corresponding equation.

- the operator defines the equation whose solutions form the pixels of the end image,
- the threshold defines the value after which a solution is considered divergent,
- if the dual space is checked, the solver will sample the parameter space instead of the initial condition space.
"""
